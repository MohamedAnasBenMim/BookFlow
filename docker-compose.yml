# Démarrage local complet : docker compose up --build
# Front : http://localhost:3000  ·  API : http://localhost:8000/docs  ·  démo : demo@bookflow.dev / demo1234
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookflow"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://bookflow:bookflow@postgres:5432/bookflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      CORS_ORIGINS: '["http://localhost:3000"]'
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: console
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30
    ports: ["8000:8000"]

  seed:
    build: ./backend
    environment: *api-env
    command: ["python", "-m", "app.seed"]
    depends_on:
      api: { condition: service_healthy }  # l'API a appliqué les migrations
    restart: "no"

  worker:
    build: ./backend
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
